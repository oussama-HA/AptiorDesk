name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[voice]" pyinstaller pillow
      - name: Stage bundled speech-to-text model
        run: python scripts/fetch_speech_model.py
      - name: Generate Windows icon
        run: python scripts/generate_release_icons.py
      - name: Stage licensed interviewer assets
        env:
          APTIORDESK_AVATAR_BUNDLE_URL: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_URL }}
          APTIORDESK_AVATAR_BUNDLE_TOKEN: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_TOKEN }}
        run: python scripts/fetch_release_avatar.py
      - name: Condition interviewer for the packaged runtime
        run: python scripts/prepare_release_avatar.py
      - name: Freeze application
        shell: pwsh
        run: |
          $env:APTIORDESK_RELEASE_ICON = (
            Resolve-Path "packaging/icons/aptiordesk.ico"
          ).Path
          $env:APTIORDESK_REQUIRE_SPEECH_MODEL = "1"
          $env:APTIORDESK_REQUIRE_AVATAR = "1"
          pyinstaller --noconfirm --clean packaging/aptiordesk.spec
      - name: Verify frozen voice and speech runtimes
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\AptiorDesk\AptiorDesk.exe" `
            -ArgumentList "--verify-install", "dist\windows-install-health.json" `
            -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path "dist\windows-install-health.json") {
              Get-Content "dist\windows-install-health.json"
            }
            throw "The frozen voice or speech runtime failed verification."
          }
          Get-Content "dist\windows-install-health.json"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer\windows\AptiorDesk.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: AptiorDesk-Windows-x64
          path: dist/installer/AptiorDesk-Windows-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e ".[voice]" pyinstaller pillow
      - name: Generate macOS icon
        run: |
          python scripts/generate_release_icons.py
          iconutil -c icns packaging/icons/AptiorDesk.iconset \
            -o packaging/icons/AptiorDesk.icns
      - name: Stage licensed interviewer assets
        env:
          APTIORDESK_AVATAR_BUNDLE_URL: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_URL }}
          APTIORDESK_AVATAR_BUNDLE_TOKEN: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_TOKEN }}
        run: python scripts/fetch_release_avatar.py
      - name: Condition interviewer for the packaged runtime
        run: python scripts/prepare_release_avatar.py
      - name: Freeze application
        env:
          APTIORDESK_RELEASE_ICON: ${{ github.workspace }}/packaging/icons/AptiorDesk.icns
          APTIORDESK_REQUIRE_AVATAR: "1"
        run: pyinstaller --noconfirm --clean packaging/aptiordesk.spec
      - name: Sign app locally
        run: codesign --force --deep --sign - dist/AptiorDesk.app
      - name: Build DMG
        run: |
          hdiutil create \
            -volname "AptiorDesk" \
            -srcfolder "dist/AptiorDesk.app" \
            -ov -format UDZO \
            "dist/AptiorDesk-macOS-x64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: AptiorDesk-macOS-x64
          path: dist/AptiorDesk-macOS-x64.dmg
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libpulse0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install release dependencies
        run: python -m pip install -e ".[voice]" pyinstaller pillow
      - name: Generate Linux icon
        run: python scripts/generate_release_icons.py
      - name: Stage licensed interviewer assets
        env:
          APTIORDESK_AVATAR_BUNDLE_URL: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_URL }}
          APTIORDESK_AVATAR_BUNDLE_TOKEN: ${{ secrets.APTIORDESK_AVATAR_BUNDLE_TOKEN }}
        run: python scripts/fetch_release_avatar.py
      - name: Condition interviewer for the packaged runtime
        run: python scripts/prepare_release_avatar.py
      - name: Freeze application
        env:
          APTIORDESK_RELEASE_ICON: ${{ github.workspace }}/packaging/icons/aptiordesk.png
          APTIORDESK_REQUIRE_AVATAR: "1"
        run: pyinstaller --noconfirm --clean packaging/aptiordesk.spec
      - name: Build AppImage and portable archive
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -a dist/AptiorDesk/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/AptiorDesk
          cp packaging/linux/aptiordesk.desktop AppDir/aptiordesk.desktop
          cp packaging/linux/aptiordesk.desktop AppDir/usr/share/applications/aptiordesk.desktop
          cp packaging/icons/aptiordesk.png AppDir/aptiordesk.png
          cp packaging/icons/aptiordesk.png AppDir/usr/share/icons/hicolor/512x512/apps/aptiordesk.png
          ln -s aptiordesk.png AppDir/.DirIcon
          curl -L -o appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage \
            AppDir dist/AptiorDesk-Linux-x86_64.AppImage
          tar -C dist -czf dist/AptiorDesk-Linux-x86_64-Portable.tar.gz AptiorDesk
      - uses: actions/upload-artifact@v4
        with:
          name: AptiorDesk-Linux-x86_64
          path: |
            dist/AptiorDesk-Linux-x86_64.AppImage
            dist/AptiorDesk-Linux-x86_64-Portable.tar.gz
          if-no-files-found: error
